<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721"/>
      <stop offset="50%" stop-color="#1C2130"/>
      <stop offset="100%" stop-color="#242B3D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Glow orb -->
  <circle cx="400" cy="200" r="160" fill="#A78BFA" opacity="0.12" filter="url(#glow)"/>

  <!-- Browser / UI Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Window Body -->
    <rect width="680" height="360" rx="12" fill="#181B26" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="12" fill="#13151E"/>
    <path d="M0 30h680v12H0z" fill="#13151E"/>
    <line x1="0" y1="42" x2="680" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.8"/>

    <!-- URL Pill -->
    <rect x="200" y="11" width="280" height="20" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="212" cy="21" r="3.5" fill="#A78BFA" opacity="0.8"/>
    <text x="224" y="25" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">princeemmanuelsdachurch.com</text>

    <!-- Mockup Canvas Body -->
    <!-- Left Navigation Bar Mock -->
    <rect x="20" y="62" width="120" height="276" rx="6" fill="rgba(255,255,255,0.02)"/>
    <rect x="32" y="76" width="96" height="12" rx="4" fill="#7C3AED" opacity="0.7"/>
    <rect x="32" y="100" width="80" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="118" width="70" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="136" width="85" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="154" width="60" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>

    <!-- Center Hero / Dashboard Card -->
    <g transform="translate(160, 62)">
      <!-- Central Banner -->
      <rect width="498" height="150" rx="8" fill="url(#accentGrad)" opacity="0.15"/>
      <rect width="498" height="150" rx="8" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>

      <!-- Icon Box -->
      <g transform="translate(30, 32)">
        <rect width="52" height="52" rx="10" fill="#7C3AED" opacity="0.25" stroke="#A78BFA" stroke-width="1"/>
        <g transform="translate(14, 14) scale(1)">
          <path d="M11 2h2v5h5v2h-5v13h-2V9H6V7h5V2z" fill="#A78BFA"/>
        </g>
      </g>

      <!-- Banner Text -->
      <text x="96" y="54" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.02em">Prince Emmanuel SDA Church</text>
      <text x="96" y="78" fill="rgba(255,255,255,0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Church Ministry & Community Portal</text>

      <!-- Bottom Mini Cards in Canvas -->
      <g transform="translate(0, 168)">
        <rect x="0" y="0" width="156" height="108" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="14" y="16" width="36" height="8" rx="2" fill="#A78BFA" opacity="0.8"/>
        <rect x="14" y="32" width="80" height="18" rx="3" fill="rgba(255,255,255,0.1)"/>
        <rect x="14" y="60" width="128" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>
        <rect x="14" y="74" width="100" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>

        <rect x="171" y="0" width="156" height="108" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="185" y="16" width="36" height="8" rx="2" fill="#A78BFA" opacity="0.8"/>
        <rect x="185" y="32" width="80" height="18" rx="3" fill="rgba(255,255,255,0.1)"/>
        <rect x="185" y="60" width="128" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>
        <rect x="185" y="74" width="100" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>

        <rect x="342" y="0" width="156" height="108" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="356" y="16" width="36" height="8" rx="2" fill="#A78BFA" opacity="0.8"/>
        <rect x="356" y="32" width="80" height="18" rx="3" fill="rgba(255,255,255,0.1)"/>
        <rect x="356" y="60" width="128" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>
        <rect x="356" y="74" width="100" height="6" rx="2" fill="rgba(255,255,255,0.05)"/>
      </g>
    </g>
  </g>
</svg>